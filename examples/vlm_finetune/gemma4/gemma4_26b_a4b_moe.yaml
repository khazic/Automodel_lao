# Configuration for fine-tuning Gemma 4 26B-A4B MoE (128 experts) with MedPix dataset
# Requires 8 GPUs (FSDP2 + EP=8, 16 experts per GPU)
# torchrun --nproc-per-node=8 examples/vlm_finetune/finetune.py -c examples/vlm_finetune/gemma4/gemma4_26b_a4b_moe.yaml

recipe: FinetuneRecipeForVLM

step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  ckpt_every_steps: 500
  val_every_steps: 500
  num_epochs: 2

dist_env:
  backend: nccl
  timeout_minutes: 60

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 42
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: google/gemma-4-26B-A4B-it
  torch_dtype: torch.bfloat16
  trust_remote_code: true
  attn_implementation: eager
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: te
    rope_fusion: true
    dispatcher: torch     # DTensor all-gather/reduce-scatter EP; no DeepEP/NVSHMEM needed
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true
  text_config:
  # 26B-A4B does not use kv_shared layers (only used in 2B, 4B), hence use_cache: false.
    use_cache: false
    # Text-only data through the VLM model: disable the vision-aware bidirectional
    # mask so the model takes the plain causal path and does not require
    # mm_token_type_ids (which text-only batches do not carry).
    use_bidirectional_attention: null

processor:
  padding_side: right

checkpoint:
  enabled: true
  checkpoint_dir: vlm_checkpoints/gemma4_26b_a4b_moe/
  model_save_format: safetensors
  save_consolidated: final

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  ep_size: 8

  sequence_parallel: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  # Text-only SFT through the VLM recipe: make_meta_dataset reads a local chat
  # JSONL (via the sft_meta.json manifest) and emits text-only conversations with
  # no image field, which default_collate_fn passes through without pixel_values.
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_meta_dataset
  path_or_dataset: /llm-align/liuchonghan/ins_dataset/ins_dataset/dayuzhong/sft_meta.json

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 0
  pin_memory: true
  collate_fn:
    # default_collate_fn is image-aware only when a turn carries an image; with
    # text-only conversations it builds labels and skips vision tensors.
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.default_collate_fn
    max_length: 2048
    drop_overlong: false

validation_dataset:
  # Same manifest as train (no separate held-out split yet); swap in a distinct
  # validation JSONL when you have one.
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_meta_dataset
  path_or_dataset: /llm-align/liuchonghan/ins_dataset/ins_dataset/dayuzhong/sft_meta.json

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    # default_collate_fn is image-aware only when a turn carries an image; with
    # text-only conversations it builds labels and skips vision tensors.
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.default_collate_fn
    max_length: 2048
    drop_overlong: false

optimizer:
  _target_: torch.optim.AdamW
  lr: 2e-5
  weight_decay: 0.01
  betas: [0.9, 0.95]

freeze_config:
  freeze_embeddings: true
  freeze_vision_tower: true
  freeze_audio_tower: true
  freeze_language_model: false

