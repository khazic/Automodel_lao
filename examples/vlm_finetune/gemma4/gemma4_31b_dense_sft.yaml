# Fine-tune Gemma 4 31B (dense) on the text-only SFT dataset.
# Dense counterpart of gemma4_26b_a4b_moe.yaml: same dataset, checkpoint, optimizer,
# and step schedule, with the MoE-specific bits removed (expert parallelism ep_size,
# the MoE dispatcher/gate backend) and dense-required activation checkpointing added.
# The dense path uses the Liger kernel (matching examples/.../gemma4_31b.yaml) instead
# of the 26B MoE's TransformerEngine backend.
# Requires 8 GPUs (FSDP2 + activation checkpointing).
# torchrun --nproc-per-node=8 examples/vlm_finetune/finetune.py -c examples/vlm_finetune/gemma4/gemma4_31b_dense_sft.yaml

recipe: FinetuneRecipeForVLM

step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  # 207k samples / gbs 8 = ~25.9k steps/epoch; x2 epochs = ~51.8k total steps.
  # ckpt_every_steps 10000 -> ~5 intermediate checkpoints + final.
  ckpt_every_steps: 10000
  num_epochs: 2

dist_env:
  backend: nccl
  timeout_minutes: 60

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 42
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: /llm-align/open_models/gemma4/gemma-4-31B-it
  torch_dtype: torch.bfloat16
  trust_remote_code: true
  use_liger_kernel: true
  use_sdpa_patching: false
  attn_implementation: eager
  text_config:
    # 31B dense does not use kv_shared layers (only 2B/4B do), hence use_cache: false.
    use_cache: false
    # Text-only data through the VLM model: disable the vision-aware bidirectional
    # mask so the model takes the plain causal path and does not require
    # mm_token_type_ids (which text-only batches do not carry).
    use_bidirectional_attention: null

processor:
  padding_side: right

checkpoint:
  enabled: true
  checkpoint_dir: /llm-align/liuchonghan/runs/gemma4_31b_dense_vlm_sft/checkpoints
  model_save_format: safetensors
  save_consolidated: every       # export HF-loadable consolidated safetensors at every (now infrequent) checkpoint

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  sequence_parallel: false
  # 31B dense OOMs under FSDP2 alone; activation checkpointing is required to fit.
  activation_checkpointing: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  # Text-only SFT through the VLM recipe: make_meta_dataset reads a local chat
  # JSONL (via the sft_meta.json manifest) and emits text-only conversations with
  # no image field, which default_collate_fn passes through without pixel_values.
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_meta_dataset
  path_or_dataset: /llm-align/liuchonghan/ins_dataset/ins_dataset/dayuzhong/sft_meta.json

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 0
  pin_memory: true
  collate_fn:
    # default_collate_fn is image-aware only when a turn carries an image; with
    # text-only conversations it builds labels and skips vision tensors.
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.default_collate_fn
    max_length: 2048
    drop_overlong: false

# Validation is intentionally disabled: the only manifest available is the full
# 207k-sample train set, and _run_validation_epoch iterates the WHOLE val
# dataloader, so validating would run a full 207k forward pass each time. Add a
# small held-out manifest plus val_every_steps in step_scheduler to re-enable.

optimizer:
  _target_: torch.optim.AdamW
  lr: 2e-5
  weight_decay: 0.01
  betas: [0.9, 0.95]

freeze_config:
  # NOTE: apply_parameter_freezing only honors the four keys below; there is no
  # freeze_embeddings hook, so embeddings (and Gemma's tied lm_head) stay trainable.
  freeze_vision_tower: true
  freeze_audio_tower: true
  freeze_language_model: false

