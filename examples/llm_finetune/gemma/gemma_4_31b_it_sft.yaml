# Full-parameter SFT for Gemma-4 31B (dense, multimodal model) on a local chat JSONL.
# The multimodal model is loaded through NeMoAutoModelForCausalLM and trained on
# text-only data (the vision-aware bidirectional mask is disabled), the same setup
# as gemma_4_26b_a4b_it_sft.yaml with the MoE expert parallelism / dispatcher / gate
# removed (31B is dense). Activation checkpointing is already required at this size.
# Single node, 8 GPUs: FSDP2 + activation checkpointing.
#
# To run this recipe:
#   torchrun --nproc-per-node=8 examples/llm_finetune/finetune.py --config examples/llm_finetune/gemma/gemma_4_31b_it_sft.yaml

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  ckpt_every_steps: 1000
  num_epochs: 1

dist_env:
  backend: nccl
  timeout_minutes: 30

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: /llm-align/open_models/gemma4/gemma-4-31B-it
  torch_dtype: torch.bfloat16
  attn_implementation: eager
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: te
    rope_fusion: true
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true
  # 31B has no kv-shared layers (only 2B/4B do), so disable the cache.
  text_config:
    use_cache: false
    # Text-only SFT: disable the vision-aware bidirectional mask so the model
    # takes the plain causal path and does not require `mm_token_type_ids`.
    use_bidirectional_attention: null

checkpoint:
  enabled: true
  checkpoint_dir: /llm-align/liuchonghan/runs/gemma4_31b_sft/checkpoints
  # HF-format checkpoints: every save writes HF-named sharded safetensors;
  # `final` additionally consolidates the last checkpoint into HF-loadable
  # files inline. Intermediate saves can be consolidated offline with
  # `bash <checkpoint>/model/consolidate.sh` (avoids idling GPUs every save).
  model_save_format: safetensors
  save_consolidated: final

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  sequence_parallel: false
  activation_checkpointing: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: /llm-align/liuchonghan/ins_dataset/ins_dataset/dayuzhong/merged_4files_filtered.jsonl
  seq_length: 2048
  truncation: true
  padding: max_length

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: true

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1e-8
  lr: 1.0e-5
  weight_decay: 0.01

lr_scheduler:
  lr_decay_style: cosine
  min_lr: 1.0e-6

