# DFlash draft training for a Qwen2.5-VL target. The target performs normal
# image encoding; the text-only Qwen3-style draft consumes selected language
# decoder hidden states and is supervised only on assistant-response tokens.
# Regenerate the responses with the same target model before training.

recipe: TrainDFlashRecipe

dist_env:
  backend: nccl
  timeout_minutes: 30

recipe_args:
  target_model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
  output_dir: ./outputs/dflash_qwen2_5_vl_7b
  seq_length: 4096
  image_max_pixels: 802816
  micro_batch_size: 1
  grad_accumulation_steps: 8
  num_workers: 4
  num_epochs: 6

  draft_num_hidden_layers: 5
  block_size: 16
  num_anchors: 512
  loss_decay_gamma: 7.0
  mask_token_id: 151669
  attention_backend: flex_attention

  trust_remote_code: false
  shuffle_seed: 42
  log_every_steps: 10
  max_grad_norm: 1.0

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_meta_dataset
  path_or_dataset: /path/to/qwen2_5_vl_regenerated/meta.json
  split: train

optimizer:
  lr: 6.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.04
  min_lr_ratio: 0.1

checkpoint:
  enabled: true
  checkpoint_dir: ./outputs/dflash_qwen2_5_vl_7b/checkpoints
  model_save_format: safetensors
  save_consolidated: true
