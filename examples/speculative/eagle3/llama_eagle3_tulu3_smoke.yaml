recipe: TrainEagle3Recipe

dist_env:
  backend: nccl
  timeout_minutes: 30

recipe_args:
  target_model_name_or_path: /llm-align/liuchonghan/dir
  train_data_path: /llm-align/liuchonghan/ins_dataset/ins_dataset/tulu3_34999.parquet
  train_split: train[:128]
  val_data_path: null
  val_split: null
  output_dir: /tmp/eagle3_test/output
  seq_length: 256
  micro_batch_size: 1
  grad_accumulation_steps: 1
  num_workers: 0
  num_epochs: 1
  ttt_steps: 2
  draft_vocab_size: 4096
  freeze_embeddings: true
  trust_remote_code: false
  shuffle_seed: 42
  log_every_steps: 1
  max_grad_norm: 1.0

optimizer:
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
