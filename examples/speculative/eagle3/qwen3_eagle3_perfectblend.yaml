recipe: TrainEagle3Recipe

dist_env:
  backend: nccl
  timeout_minutes: 30

recipe_args:
  target_model_name_or_path: Qwen/Qwen3-8B
  train_data_path: ./cache/dataset/perfectblend-qwen3-8b-regen/data
  val_data_path: null
  train_split: null
  val_split: null
  output_dir: ./outputs/eagle3_qwen3_8b
  seq_length: 4096
  micro_batch_size: 1
  grad_accumulation_steps: 1
  num_workers: 0  # >0 spawns forkserver workers that can't pickle the BOS/EOS-enforced tokenizer class
  num_epochs: 2
  ttt_steps: 7
  draft_vocab_size: 32000
  freeze_embeddings: true
  trust_remote_code: false
  shuffle_seed: 42
  log_every_steps: 10
  max_grad_norm: 1.0

optimizer:
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0

checkpoint:
  enabled: true
  checkpoint_dir: ./outputs/eagle3_qwen3_8b/checkpoints
  model_save_format: safetensors
  save_consolidated: true
