# P-EAGLE (parallel-drafting EAGLE-3) draft training for openai/gpt-oss-20b.
#
# Same target/draft pairing as ``examples/speculative/eagle3/gpt_oss_20b_eagle3.yaml``
# (frozen gpt-oss MoE target, co-located + expert-parallel sharded; draft is the
# Llama-style ``GptOssEagle3DraftModel`` reproducing gpt-oss's YaRN RoPE so it
# stays positionally consistent with the target -- see
# ``components/speculative/eagle/draft_gpt_oss.py``), but trained in *parallel
# drafting* mode instead of EAGLE-3 TTT. ``GptOssEagle3DraftModel`` inherits the
# P-EAGLE mixins from ``LlamaEagle3DraftModel``, so it transparently gains the
# learnable ``mask_hidden`` placeholder and the single COD-subsampled parallel
# forward; the YaRN rotary is swapped into every draft layer (including the
# stacked deep layers), so multi-layer P-EAGLE drafts stay correct.
#
# IMPORTANT -- inference runtime. P-EAGLE inference is implemented in vLLM via
# the speculators format; the checkpoint saves ``mask_hidden`` and writes
# ``mask_token_id`` / ``num_depths`` / the COD ratios into the draft
# ``config.json``. SGLang does not serve a P-EAGLE head today. P-EAGLE also
# requires the LIVE target for supervision (the offline EAGLE-3 cache is
# TTT-only), so do not set ``cached_target_path`` here.
#
# To run (8 GPUs):
#   automodel examples/speculative/p-eagle/gpt_oss_20b_peagle.yaml --nproc-per-node 8

recipe: TrainEagle3Recipe

dist_env:
  backend: nccl
  timeout_minutes: 60

recipe_args:
  target_model_name_or_path: openai/gpt-oss-20b

  # Any conversation dataset works -- the gpt-oss target generates the EAGLE-3
  # supervision online, so the dataset only supplies the prompt/turn text. The
  # gpt-oss tokenizer applies its Harmony chat template automatically. For the
  # best draft quality, use data whose assistant turns were generated by
  # gpt-oss itself (matching the deployment distribution).
  train_data_path: HuggingFaceH4/ultrachat_200k
  val_data_path: null
  train_split: "train_sft"
  val_split: null

  output_dir: ./outputs/peagle_gpt_oss_20b
  seq_length: 4096

  micro_batch_size: 1
  grad_accumulation_steps: 8
  num_workers: 0
  num_epochs: 1

  draft_vocab_size: 32000
  freeze_embeddings: false

  trust_remote_code: false
  shuffle_seed: 42
  log_every_steps: 50
  max_grad_norm: 1.0

  # ----------------------------------------------------------------------
  # P-EAGLE knobs (see examples/speculative/p-eagle/llama_peagle_mvp.yaml for
  # the full rationale on each).
  #
  # ``parallel_drafting: true`` switches from the EAGLE-3 TTT trainer to the COD
  # parallel-drafting trainer and registers the learnable ``mask_hidden``.
  #
  # ``num_depths`` (K) is the number of parallel COD prediction depths; it must
  # match the vLLM ``num_speculative_tokens`` at inference.
  #
  # ``num_draft_layers`` stacks decoder layers (fused first layer + vanilla
  # layers); the speculators reference trains 4.
  #
  # ``mask_token_id`` is REQUIRED: the reserved token id placed at masked
  # multi-token-prediction slots; its embed_tokens row is the masked-token
  # signal, so it must be a token that carries no meaning. For gpt-oss-20b,
  # 200000 is ``<|reserved_200000|>`` -- an explicitly reserved Harmony special
  # token (vocab_size=201088), guaranteed not to appear in real content. The
  # same id must be present in the draft config.json vLLM reads at serve time.
  # ----------------------------------------------------------------------
  parallel_drafting: true
  num_depths: 8
  num_draft_layers: 4
  down_sample_ratio: 0.7
  down_sample_ratio_min: 0.2
  mask_token_id: 200000

  # ``sequence_partitions`` (S) is a training-only memory knob: with S > 1 the
  # trainer splits each sequence into S segments by dependency lineage and runs
  # a separate forward+backward per segment, accumulating gradients so only one
  # segment's activations are resident at a time (P-EAGLE Algorithm 1,
  # arXiv:2602.01469). The loss and saved checkpoint are unchanged. Leave at 1
  # until you hit a memory wall, then raise (e.g. 2/4/8).
  sequence_partitions: 1

# Expert-parallel shard the frozen gpt-oss MoE target across the 8 GPUs so it
# fits alongside the draft. The draft itself is small and replicated (DDP).
distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 1
  sequence_parallel: false

optimizer:
  lr: 1.0e-4
  warmup_ratio: 0.015
