recipe: TrainEagle3Recipe

# P-EAGLE (parallel-drafting EAGLE-3) MVP recipe. Trains the same Llama-style
# EAGLE-3 draft as ``llama_eagle3_mvp_flash_attn.yaml`` but in *parallel
# drafting* mode. Following the vLLM P-EAGLE implementation
# (https://github.com/vllm-project/speculators/pull/480), the draft predicts all
# ``num_depths`` tokens in a SINGLE forward over a flat, COD-subsampled sequence
# (depth 0 keeps every position; depth d keeps a geometrically decaying
# ``down_sample_ratio**d`` fraction). Masked depths condition on a learnable
# ``mask_hidden`` placeholder and the reserved ``mask_token_id`` token. Cross-depth
# visibility is enforced by a flex-attention COD mask -- this is NOT EAGLE-3's
# autoregressive TTT recurrence.
#
# IMPORTANT -- inference runtime. P-EAGLE inference is implemented in vLLM via
# the speculators format. The checkpoint this recipe produces saves the
# learnable ``mask_hidden`` tensor (shape ``[1, 1, 3*hidden_size]``) and writes
# ``mask_token_id`` / ``num_depths`` / the COD ratios into the draft
# ``config.json`` so vLLM loads it unchanged. SGLang does not serve a P-EAGLE
# head today, so the ``serve_sglang`` entry point cannot serve this draft.
# Training and the on-disk format are validated by CPU unit tests; acceptance /
# speedup numbers can only be measured by running the head under vLLM on a GPU.

dist_env:
  backend: nccl
  timeout_minutes: 30

recipe_args:
  target_model_name_or_path: /llm-align/open_models/Qwen3/Qwen3-8B

  # ``jihwan1205/perfectblend-qwen3-8b-regen`` is
  # distributed with a ``conversations`` column, but ChatDataset expects
  # ``messages``. Before pointing the recipe at the dataset, rename the
  # column locally (one-liner shown below) and pass the rewritten
  # directory or HF dataset ID here.
  #
  # uv run python -c "from pathlib import Path; import pandas as pd; from huggingface_hub import list_repo_files, hf_hub_download; repo='jihwan1205/perfectblend-qwen3-8b-regen'; \
  # dst=Path('./cache/dataset/perfectblend-qwen3-8b-regen-messages'); dst.mkdir(parents=True, exist_ok=True); \
  # files=sorted(f for f in list_repo_files(repo, repo_type='dataset') if f.startswith('data/train-') and f.endswith('.parquet')); \
  # [pd.read_parquet(hf_hub_download(repo_id=repo, repo_type='dataset', filename=f)).rename(columns={'conversations':'messages'}).to_parquet(dst / Path(f).name, index=False) for f in files]; \
  # print(f'wrote {len(files)} shards to {dst}')"

  train_data_path: /llm-align/liuchonghan/Automodel_lao/cache/dataset/perfectblend-qwen3-8b-regen-messages
  val_data_path: null

  train_split: "train"
  val_split: null

  output_dir: ./outputs/p_eagle_kv_reuse
  seq_length: 2048
  micro_batch_size: 1
  # 8 amortizes the cross-node TCP gradient all-reduce (~6.4s for the 2B draft
  # over eth0) across 8 local micro-batches via DDP no_sync; at 1 the all-reduce
  # dominated each step (7.1s/step, below single-node throughput).
  grad_accumulation_steps: 8
  num_workers: 0  # >0 spawns forkserver workers that can't pickle the BOS/EOS-enforced tokenizer class
  num_epochs: 2
  draft_vocab_size: 32000
  selected_token_ids_path: ./outputs/peagle_qwen3_8b_perfectblend/draft_token_map_151936.pt
  freeze_embeddings: false
  trust_remote_code: false
  shuffle_seed: 42
  log_every_steps: 50
  max_grad_norm: 1.0

  parallel_drafting: true
  num_depths: 8
  num_draft_layers: 4
  down_sample_ratio: 0.8
  down_sample_ratio_min: 0.2
  mask_token_id: 151669
  sequence_partitions: 1

  kv_reuse: true
  # kv_reuse_layer_ids auto-derived from num_draft_layers when omitted.

  ckpt_every_steps: 10000
  save_checkpoint_every_epoch: true

optimizer:
  lr: 1e-4
  betas: [0.9, 0.95]
  weight_decay: 0
  warmup_ratio: 0.015

wandb:
  project: automodel
  name: p_eagle_kv_reuse
  mode: offline
  dir: ./wandb
