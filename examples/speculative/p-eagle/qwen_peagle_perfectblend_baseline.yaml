recipe: TrainEagle3Recipe

# Baseline A/B partner of qwen_peagle_perfectblend.yaml: identical in every
# respect EXCEPT kv_reuse is OFF. Run both and diff the per-depth accept@k
# (Δ = kvreuse - baseline) to attribute any deep-position gain to KV-reuse.
# Keep draft_vocab_size / data / shuffle_seed / COD ratios byte-for-byte equal
# to the kv_reuse config or the comparison is confounded.

dist_env:
  backend: nccl
  timeout_minutes: 30

recipe_args:
  target_model_name_or_path: Qwen/Qwen3-8B

  train_data_path: /workspace/jiale1/datasets/perfectblend-qwen3-8b-regen-messages

  val_data_path: /workspace/jiale1/datasets/perfectblend-qwen3-8b-regen-messages

  train_split: "train[:70000]"

  output_dir: ./outputs/peagle_qwen3_8b_perfectblend_baseline
  seq_length: 4096
  micro_batch_size: 1
  grad_accumulation_steps: 1
  num_workers: 0
  num_epochs: 20
  draft_vocab_size: 32000

  selected_token_ids_path: ./cache/peagle_qwen3_8b_draft_token_map_32000.pt
  freeze_embeddings: false
  trust_remote_code: false
  shuffle_seed: 42
  log_every_steps: 50
  max_grad_norm: 1.0

  parallel_drafting: true
  num_depths: 8
  num_draft_layers: 4
  down_sample_ratio: 0.8
  down_sample_ratio_min: 0.2
  mask_token_id: 151669

  kv_reuse: false

  sequence_partitions: 1

optimizer:
  lr: 1e-4
  betas: [0.9, 0.95]
  weight_decay: 0
  warmup_ratio: 0.015

wandb:
  project: peagle
  name: qwen_peagle_perfectblend_baseline
