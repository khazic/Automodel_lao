recipe: TrainEagle3Recipe

dist_env:
  backend: nccl
  timeout_minutes: 60

recipe_args:
  # Update these to match your environment.
  target_model_name_or_path: /llm-align/liuchonghan/dir
  # Directory of parquet files. Must have a ``messages`` column in
  # OpenAI chat format. The raw download uses ``conversations``; convert
  # with a one-line ``df.rename(columns={"conversations": "messages"})``
  # and save to this directory.
  train_data_path: /llm-align/liuchonghan/datasets/frankleeeee/PerfectBlend-Regenerated-Llama-3.1-8B-Instruct/messages
  val_data_path: null

  train_split: null
  val_split: null

  output_dir: ./outputs/eagle3_llama_perfectblend

  seq_length: 2048

  # 8 GPUs * micro_batch=1 * grad_accum=4 -> effective batch 32.
  micro_batch_size: 1
  grad_accumulation_steps: 4
  num_workers: 4

  # PerfectBlend has ~1.42M rows -> ~44k optim steps per epoch on 8 GPUs.
  # One epoch is already more total training than 3 epochs on tulu3 (35k
  # samples, ~3.3k optim steps total), so default to a single pass and
  # let the schedule decay across it.
  num_epochs: 1

  ttt_steps: 4
  draft_vocab_size: 32000
  freeze_embeddings: true

  trust_remote_code: false
  shuffle_seed: 42
  log_every_steps: 50
  max_grad_norm: 1.0

optimizer:
  lr: 2.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  # Total optim steps is ~44k, so a 2% warmup ≈ 880 steps -- plenty for
  # AdamW second moments to settle without burning epoch start.
  warmup_ratio: 0.02
  min_lr_ratio: 0.1
